AllCops:
  NewCops: enable
  # Keep in step with required_ruby_version in eedbi.gemspec.
  TargetRubyVersion: 3.1
  SuggestExtensions: false

Layout/LineLength:
  Max: 120

# Between RuboCop's defaults, which suit small application methods more than
# crypto and CLI code, and no limit at all.
Metrics/AbcSize:
  Max: 30
  Exclude:
    - test/**/*

Metrics/BlockLength:
  Exclude:
    - test/**/*

Metrics/ClassLength:
  Max: 200
  Exclude:
    - test/**/*

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/MethodLength:
  Max: 25
  Exclude:
    - test/**/*

Metrics/PerceivedComplexity:
  Max: 10

Metrics/ParameterLists:
  CountKeywordArgs: false

# iv is the standard name for an initialization vector.
Naming/MethodParameterName:
  AllowedNames: [as, at, by, cc, db, id, if, in, io, ip, iv, of, on, os, pp, to]

Naming/PredicateMethod:
  AllowedMethods:
    - secure_compare

Naming/VariableNumber:
  Exclude:
    - test/**/*
